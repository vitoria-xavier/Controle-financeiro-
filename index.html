<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Controle Financeiro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Controle Financeiro</h1>

    <div id="resumo">

    <h2>Resumo financeiro</h2>

    <div class="cards-resumo">

        <div class="card receita-card">
            <span>Receitas</span>
            <strong id="total-receitas">R$ 0,00</strong>
        </div>

        <div class="card despesa-card">
            <span>Despesas</span>
            <strong id="total-despesas">R$ 0,00</strong>
        </div>

        <div class="card saldo-card">
            <span>Saldo</span>
            <strong id="saldo">R$ 0,00</strong>
        </div>

    </div>

    </div>

    <p>
        Meu primeiro projeto desenvolvido durante meus estudos
        de Análise e Desenvolvimento de Sistemas.
    </p>

    <h2>Novo lançamento</h2>

    <form>

        <label for="descricao">Descrição</label>

        <input
            type="text"
            id="descricao"
            placeholder="Ex: Salário"
        >

        <label for="valor">Valor</label>

        <input
            type="number"
            id="valor"
            placeholder="Ex: 1500"
        >

        <label for="tipo">Tipo</label>

        <select id="tipo">

            <option value="receita">
                Receita
            </option>

            <option value="despesa">
                Despesa
            </option>

        </select>

        <button type="submit">
            Adicionar lançamento
        </button>

    </form>

    <h2>Lançamentos</h2>

    <ul id="lista-lancamentos"></ul>

    <script src="script.js"></script>

</body>

                </html>
